name: Formal Verification & Bounded Model Checking

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  formal-verification:
    name: CBMC Model Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install CBMC
        run: |
          sudo apt-get update
          sudo apt-get install -y cbmc

      - name: Mathematical Buffer & Overflow Proofs
        run: |
          cbmc src/tensor_ops.c \
               src/safety_invariants.c \
               src/core_neural_kernels.c \
               tests/unit_tests.c \
               --pointer-check \
               --bounds-check \
               --div-by-zero-check \
               --signed-overflow-check \
               --unsigned-overflow-check \
               -I include \
               --unwind 10
