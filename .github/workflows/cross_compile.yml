name: Bare-Metal Cross-Compilation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cross-compile:
    name: Multi-Arch Cross-Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        run: |
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Install Cross-Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi gcc-riscv64-linux-gnu libc6-dev-riscv64-cross

      - name: Compile for ARM Cortex-M (Bare-Metal)
        run: |
          arm-none-eabi-gcc -c -O3 -std=c18 -Wall -Wextra -Werror -Wpedantic \
            -I core_neural_c/include \
            -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 \
            core_neural_c/src/tensor_ops.c \
            core_neural_c/src/safety_invariants.c \
            core_neural_c/src/core_neural_kernels.c \
            core_neural_c/src/main.c

      - name: Compile for RISC-V (Bare-Metal)
        run: |
          riscv64-linux-gnu-gcc -c -O3 -std=c18 -Wall -Wextra -Werror -Wpedantic \
            -I core_neural_c/include \
            core_neural_c/src/tensor_ops.c \
            core_neural_c/src/safety_invariants.c \
            core_neural_c/src/core_neural_kernels.c \
            core_neural_c/src/main.c
