name: Bare-Metal Cross-Compilation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cross-compile:
    name: Multi-Arch Cross-Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cross-Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi gcc-riscv64-unknown-elf || \
          sudo apt-get install -y gcc-arm-none-eabi gcc-riscv64-linux-gnu

      - name: Compile for ARM Cortex-M (Bare-Metal)
        run: |
          arm-none-eabi-gcc -c -O3 -std=c18 -Wall -Wextra -Werror -Wpedantic \
            -I core_neural_c/include \
            -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 \
            core_neural_c/src/tensor_ops.c \
            core_neural_c/src/safety_invariants.c \
            core_neural_c/src/core_neural_kernels.c \
            core_neural_c/src/main.c

      - name: Compile for RISC-V (Bare-Metal)
        run: |
          if command -v riscv64-unknown-elf-gcc >/dev/null 2>&1; then
            CROSS_RV=riscv64-unknown-elf-gcc
          else
            CROSS_RV=riscv64-linux-gnu-gcc
          fi
          $CROSS_RV -c -O3 -std=c18 -Wall -Wextra -Werror -Wpedantic \
            -I core_neural_c/include \
            core_neural_c/src/tensor_ops.c \
            core_neural_c/src/safety_invariants.c \
            core_neural_c/src/core_neural_kernels.c \
            core_neural_c/src/main.c
